apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-k8s-app
  namespace: qa
  annotations:
      circleci.com/project-id: 026d4314-88c9-4e87-a63f-aaa6301a9093
  labels:
      circleci.com/component-name: my-k8s-app
      circleci.com/version: 1.0.0
      app: my-k8s-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: my-k8s-app
  template:
    metadata:
      labels:
        app: my-k8s-app
        circleci.com/component-name: my-k8s-app
        circleci.com/version: 1.0.0
    spec:
      containers:
      - name: my-k8s-app
        image: alexh2004/my-k8s-app:qa
        imagePullPolicy : Always
        ports:
        - containerPort: 3000
      restartPolicy : Always
